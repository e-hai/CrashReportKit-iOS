name: CrashReportKitDemo
options:
  bundleIdPrefix: com.kit.crashreport
  deploymentTarget:
    iOS: "15.0"
packages:
  CrashReportKit:
    path: .
targets:
  CrashReportKitDemo:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sample
    dependencies:
      - package: CrashReportKit
        product: CrashReportKit
    settings:
      base:
        INFOPLIST_FILE: Sample/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.kit.crashreport.demo
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.0"
schemes:
  CrashReportKitDemo:
    build:
      targets:
        CrashReportKitDemo: all
    run:
      config: Debug
